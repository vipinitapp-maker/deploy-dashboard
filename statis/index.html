<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuardianHub Deployment Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                        terminalbg: '#020617'
                    }
                }
            }
        }
    </script>
    <style>
        .terminal-scroll::-webkit-scrollbar { width: 6px; }
        .terminal-scroll::-webkit-scrollbar-track { background: #020617; }
        .terminal-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body class="bg-darkbg text-slate-100 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-cardbg border-b border-slate-700 px-6 py-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="h-3 w-3 rounded-full bg-emerald-500 animate-ping"></div>
            <h1 class="text-xl font-bold tracking-wide text-white">GuardianHub <span class="text-emerald-400 font-normal">Deployment Manager</span></h1>
        </div>
        <div class="flex items-center space-x-4">
            <button onclick="deployAll()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-4 py-2 rounded-lg transition shadow-md flex items-center space-x-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d=" "></path></svg>
                <span>Deploy All Services</span>
            </button>
            <button onclick="refreshStatuses()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-2 rounded-lg transition">
                ↻ Refresh Status
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 max-w-7xl mx-auto w-full">

        <!-- Left 2 Columns: Service Cards -->
        <section class="lg:col-span-2 space-y-4">
            <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Services & Status</h2>
            <div id="services-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Dynamic Service Cards Inserted Here -->
            </div>
        </section>

        <!-- Right 1 Column: Build Terminal Output -->
        <section class="flex flex-col h-[calc(100vh-140px)]">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Console Output</h2>
                <button onclick="clearTerminal()" class="text-xs text-slate-400 hover:text-slate-200">Clear Logs</button>
            </div>
            <div id="terminal" class="terminal-scroll flex-1 bg-terminalbg border border-slate-800 rounded-xl p-4 font-mono text-xs text-slate-300 overflow-y-auto whitespace-pre-wrap leading-relaxed shadow-inner">
<span class="text-slate-500">[System] Dashboard initialized. Select a service to trigger build and deployment...</span>
            </div>
        </section>
    </main>

    <script>
        let ws;
        let servicesData = [];

        async function init() {
            setupWebSocket();
            await fetchServices();
            await refreshStatuses();
            setInterval(refreshStatuses, 10000); // Auto refresh status every 10s
        }

        function setupWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws/deploy`);

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'log') {
                    appendLog(data.line);
                } else if (data.type === 'status_update') {
                    updateServiceStatusUI(data.service_id, data.status);
                }
            };

            ws.onclose = () => {
                setTimeout(setupWebSocket, 3000);
            };
        }

        async function fetchServices() {
            const res = await fetch('/api/services');
            servicesData = await res.json();
            renderCards();
        }

        async function refreshStatuses() {
            const res = await fetch('/api/status');
            const statuses = await res.json();
            statuses.forEach(s => {
                updateServiceStatusUI(s.service_id, s.status, s.replicas);
            });
        }

        function renderCards() {
            const container = document.getElementById('services-container');
            container.innerHTML = servicesData.map(svc => `
                <div id="card-${svc.deployment}" class="bg-cardbg border border-slate-700/60 rounded-xl p-5 shadow-sm flex flex-col justify-between space-y-4 hover:border-slate-600 transition">
                    <div>
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="text-xs font-mono text-slate-400">${svc.category}</span>
                                <h3 class="text-lg font-bold text-white">${svc.name}</h3>
                            </div>
                            <span id="badge-${svc.deployment}" class="px-2.5 py-1 rounded-full text-xs font-medium bg-slate-800 text-slate-400 border border-slate-700">
                                Checking...
                            </span>
                        </div>
                        <div class="mt-3 space-y-1 text-xs text-slate-400 font-mono">
                            <p><span class="text-slate-500">Namespace:</span> ${svc.namespace}</p>
                            <p><span class="text-slate-500">Dir:</span> <span class="truncate block text-slate-300" title="${svc.working_dir}">${svc.working_dir}</span></p>
                            <p><span class="text-slate-500">Replicas:</span> <span id="replicas-${svc.deployment}">-</span></p>
                        </div>
                    </div>
                    <button id="btn-${svc.deployment}" onclick="deployService('${svc.deployment}')"
                        class="w-full bg-slate-700 hover:bg-slate-600 text-white font-medium py-2 rounded-lg text-sm transition shadow flex items-center justify-center space-x-2">
                        <span>Deploy / Rebuild</span>
                    </button>
                </div>
            `).join('');
        }

        function updateServiceStatusUI(svcId, status, replicas = null) {
            const badge = document.getElementById(`badge-${svcId}`);
            const btn = document.getElementById(`btn-${svcId}`);
            const replicasEl = document.getElementById(`replicas-${svcId}`);

            if (!badge) return;

            if (replicas) replicasEl.innerText = replicas;

            switch(status) {
                case 'READY':
                    badge.className = "px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 flex items-center space-x-1.5";
                    badge.innerHTML = `<span class="h-2 w-2 rounded-full bg-emerald-400"></span><span>Deployed & Ready</span>`;
                    btn.disabled = false;
                    btn.className = "w-full bg-slate-700 hover:bg-slate-600 text-white font-medium py-2 rounded-lg text-sm transition";
                    break;
                case 'BUILDING':
                    badge.className = "px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/30 flex items-center space-x-1.5 animate-pulse";
                    badge.innerHTML = `<span class="h-2 w-2 rounded-full bg-amber-400"></span><span>Building & Deploying...</span>`;
                    btn.disabled = true;
                    btn.className = "w-full bg-slate-800 text-slate-500 cursor-not-allowed font-medium py-2 rounded-lg text-sm";
                    break;
                case 'PROGRESSING':
                    badge.className = "px-2.5 py-1 rounded-full text-xs font-semibold bg-blue-500/10 text-blue-400 border border-blue-500/30 flex items-center space-x-1.5";
                    badge.innerHTML = `<span class="h-2 w-2 rounded-full bg-blue-400 animate-ping"></span><span>Rollout Progressing</span>`;
                    break;
                case 'FAILED':
                    badge.className = "px-2.5 py-1 rounded-full text-xs font-semibold bg-rose-500/10 text-rose-400 border border-rose-500/30 flex items-center space-x-1.5";
                    badge.innerHTML = `<span class="h-2 w-2 rounded-full bg-rose-400"></span><span>Failed</span>`;
                    btn.disabled = false;
                    btn.className = "w-full bg-rose-600 hover:bg-rose-500 text-white font-medium py-2 rounded-lg text-sm transition";
                    break;
                default:
                    badge.className = "px-2.5 py-1 rounded-full text-xs font-medium bg-slate-800 text-slate-400 border border-slate-700";
                    badge.innerText = status;
            }
        }

        function deployService(svcId) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action: 'deploy_service', service_id: svcId }));
            }
        }

        function deployAll() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action: 'deploy_all' }));
            }
        }

        function appendLog(line) {
            const term = document.getElementById('terminal');
            term.innerText += line;
            term.scrollTop = term.scrollHeight;
        }

        function clearTerminal() {
            document.getElementById('terminal').innerText = '';
        }

        window.onload = init;
    </script>
</body>
</html>
